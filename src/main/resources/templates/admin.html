<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자</title>
    <link rel="stylesheet" href="/css/game.css">
    <link rel="stylesheet" href="/css/visual-novel.css">
    <script defer src="/js/game.js"></script>
</head>
<body class="scene scene-admin">
<div class="snow" aria-hidden="true"></div>
<header class="topbar">
    <div>
        <p class="eyebrow">관리자 콘솔</p>
        <h1 data-phase-label th:text="${state.phase.label}">대기실</h1>
        <p class="topbar-note" data-phase-description th:text="${state.phase.description}"></p>
    </div>
    <div class="topbar-actions">
        <form action="/leave" method="post">
            <button class="button danger small" type="submit">입장 화면으로 나가기</button>
        </form>
        <div class="timer" data-timer>00:00</div>
    </div>
</header>

<main class="admin-grid">
    <section class="parchment">
        <p class="eyebrow">진행 제어</p>
        <ol class="phase-list">
            <li th:each="phase : ${phases}" th:classappend="${phase == state.phase} ? 'active'">
                <strong th:text="${phase.label}">대기실</strong>
                <span th:text="${phase.description}">설명</span>
            </li>
        </ol>
        <div class="button-row">
            <form action="/admin/phase/previous" method="post"><button class="button ghost" type="submit">이전 단계</button></form>
            <form action="/admin/phase/next" method="post"><button class="button primary" type="submit">다음 단계</button></form>
            <form action="/admin/reveal/ending" method="post">
                <button class="button danger" type="submit" th:disabled="${endingRevealed}">
                    <span th:if="${!endingRevealed}">엔딩 진실 공개</span>
                    <span th:if="${endingRevealed}">엔딩 공개됨</span>
                </button>
            </form>
        </div>
    </section>

    <section class="parchment">
        <p class="eyebrow">타이머</p>
        <div class="giant-timer" data-timer>00:00</div>
        <form class="timer-form" action="/admin/timer/set" method="post">
            <label>분<input name="minutes" type="number" min="0" max="120" value="10"></label>
            <label>초<input name="seconds" type="number" min="0" max="59" value="0"></label>
            <button class="button ghost" type="submit">설정</button>
        </form>
        <div class="button-row">
            <form action="/admin/timer/start" method="post"><button class="button primary" type="submit">시작</button></form>
            <form action="/admin/timer/stop" method="post"><button class="button ghost" type="submit">정지</button></form>
            <form action="/admin/timer/reset" method="post"><button class="button danger" type="submit">초기화</button></form>
        </div>
    </section>

    <section class="parchment disclosure-section">
        <p class="eyebrow">개인 이야기 공개</p>
        <div class="global-release-row">
            <form action="/admin/reveal/story" method="post">
                <button class="button primary" type="submit" th:disabled="${globalDisclosure.storyUnlocked()}">
                    <span th:if="${!globalDisclosure.storyUnlocked()}">개인 이야기 전체 공개</span>
                    <span th:if="${globalDisclosure.storyUnlocked()}">개인 이야기 전체 공개됨</span>
                </button>
            </form>
        </div>
        <div class="global-status">
            <span><i class="status-light" th:classappend="${globalDisclosure.storyUnlocked()} ? ' open'"></i><b th:text="${globalDisclosure.storyUnlockedCount} + ' / ' + ${globalDisclosure.storyTotalCount}">0 / 4</b> 개인 이야기</span>
        </div>

        <div class="disclosure-board">
            <article class="disclosure-row" th:each="item : ${disclosures}">
                <header>
                    <strong th:text="${item.player.name}">빨간망토</strong>
                    <span th:text="${item.player.role}">역할</span>
                </header>
                <div class="disclosure-item" th:classappend="${item.storyRevealed} ? 'open'">
                    <span><i class="status-light" th:classappend="${item.storyRevealed} ? ' open'"></i>개인 이야기</span>
                    <b th:if="${item.storyRevealed}">열람 가능</b>
                    <form th:if="${!item.storyRevealed}" action="/admin/reveal/player-story" method="post">
                        <input type="hidden" name="playerCode" th:value="${item.player.code}">
                        <button class="button primary small" type="submit">이 캐릭터만 공개</button>
                    </form>
                </div>
            </article>
        </div>
    </section>

    <section class="parchment">
        <p class="eyebrow">입장 플레이어</p>
        <div class="player-list" th:if="${not #lists.isEmpty(players)}">
            <div th:each="entry : ${players}">
                <strong th:text="${entry.player.name}">빨간망토</strong>
                <span th:text="${entry.player.role}">역할</span>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(players)}">아직 입장한 플레이어가 없습니다.</p>
    </section>

    <section class="parchment">
        <p class="eyebrow">투표 현황</p>
        <div class="player-list" th:if="${not #lists.isEmpty(votes)}">
            <div th:each="vote : ${votes}">
                <strong th:text="${vote.voter.name}">앨리스</strong>
                <span th:text="${vote.suspect.name}">빨간망토</span>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(votes)}">아직 제출된 투표가 없습니다.</p>
    </section>
    <section class="parchment disclosure-section">
        <p class="eyebrow">증거 공개</p>
        <div class="button-row">
            <form action="/admin/evidence/public/release" method="post">
                <input type="hidden" name="order" value="1">
                <button class="button primary" type="submit" th:disabled="${evidenceReleaseStatus.firstPublicReleased()}">1차 공용 증거 공개</button>
            </form>
            <form action="/admin/evidence/private/release" method="post">
                <input type="hidden" name="order" value="1">
                <button class="button primary" type="submit" th:disabled="${evidenceReleaseStatus.firstPrivateReleased()}">1차 비공개 단서 지급</button>
            </form>
            <form action="/admin/evidence/public/release" method="post">
                <input type="hidden" name="order" value="2">
                <button class="button ghost" type="submit" th:disabled="${evidenceReleaseStatus.secondPublicReleased()}">2차 공용 증거 공개</button>
            </form>
            <form action="/admin/evidence/private/release" method="post">
                <input type="hidden" name="order" value="2">
                <button class="button ghost" type="submit" th:disabled="${evidenceReleaseStatus.secondPrivateReleased()}">2차 비공개 단서 지급</button>
            </form>
        </div>
        <div class="global-status">
            <span><i class="status-light" th:classappend="${evidenceReleaseStatus.firstPublicReleased()} ? ' open'"></i>1차 공용 증거</span>
            <span><i class="status-light" th:classappend="${evidenceReleaseStatus.firstPrivateReleased()} ? ' open'"></i>1차 비공개 단서</span>
            <span><i class="status-light" th:classappend="${evidenceReleaseStatus.secondPublicReleased()} ? ' open'"></i>2차 공용 증거</span>
            <span><i class="status-light" th:classappend="${evidenceReleaseStatus.secondPrivateReleased()} ? ' open'"></i>2차 비공개 단서</span>
        </div>
        <div class="disclosure-board">
            <article class="disclosure-row" th:each="group : ${privateEvidenceStatuses}">
                <header>
                    <strong th:text="${group.player.name}">빨간망토</strong>
                    <span>비공개 단서 상태</span>
                </header>
                <div class="disclosure-item" th:each="item : ${group.items}" th:classappend="${item.status == 'PUBLIC'} ? 'open'">
                    <span>
                        <i class="status-light" th:classappend="${item.status != 'LOCKED'} ? ' open'"></i>
                        <b th:text="${item.revealOrder} + '차'">1차</b>
                        <span th:text="${item.title}">증거</span>
                    </span>
                    <b th:text="${item.status == 'LOCKED' ? '미지급' : (item.status == 'PUBLIC' ? '전체 공개' : '본인만 확인')}">상태</b>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
