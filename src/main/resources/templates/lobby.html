<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>플레이어 무대</title>
    <link rel="stylesheet" href="/css/game.css">
    <link rel="stylesheet" href="/css/visual-novel.css">
    <script defer src="/js/game.js"></script>
</head>
<body class="scene scene-game stage-body" th:classappend="' player-' + ${#strings.toLowerCase(player.code)}">
<div class="snow" aria-hidden="true"></div>
<header class="topbar stage-topbar">
    <div>
        <p class="eyebrow">현재 막</p>
        <h1 data-phase-label th:text="${state.phase.label}">대기실</h1>
        <p class="topbar-note" data-phase-description th:text="${state.phase.description}"></p>
    </div>
    <div class="topbar-actions">
        <form action="/leave" method="post">
            <button class="button danger small" type="submit">입장 화면으로 나가기</button>
        </form>
        <div class="timer" data-timer>00:00</div>
    </div>
</header>

<main class="murder-stage">
    <section class="stage-circle" aria-label="붉은 설산의 저택 무대">
        <div class="round-table" aria-hidden="true"></div>
        <div class="stage-props" aria-hidden="true">
            <span class="prop candle"></span>
            <span class="prop watch"></span>
            <span class="prop card card-one"></span>
            <span class="prop card card-two"></span>
        </div>

        <button class="character-shadow"
                th:each="character, stat : ${suspects}"
                th:classappend="| character-${#strings.toLowerCase(character.code)} ${character.code == player.code ? 'self' : ''}|"
                th:style="'--i:' + ${stat.index} + '; --total:' + ${suspects.size()} + '; --accent:' + ${character.color}"
                th:data-name="${character.name}"
                th:data-role="${character.publicDescription}"
                type="button">
            <img class="silhouette-img"
                 th:src="@{'/images/characters/' + ${#strings.toLowerCase(character.code)} + '.png'}"
                 th:alt="${character.name} + ' 실루엣'">
            <span class="shadow-tooltip">
                <strong th:text="${character.name}">빨간망토</strong>
                <em th:text="${character.publicDescription}">사람을 쉽게 믿지 않는 인물</em>
            </span>
        </button>
    </section>

    <aside class="personal-dock" aria-label="개인 기능">
        <a class="button ghost small investigation-link" href="/map" th:hidden="${!investigationOpen}">사건 장소</a>
        <button class="button ghost small" data-panel-target="acting-panel" type="button">연기 힌트</button>
        <button class="button ghost small"
                type="button"
                data-story-pdf-open
                data-story-pdf-button
                th:disabled="${!storyRevealed}"
                th:data-story-pdf-title="${player.name} + ' 개인 이야기'"
                th:data-story-pdf-src="@{'/docs/' + ${#strings.toLowerCase(player.code)} + '-private-story.pdf#toolbar=0&navpanes=0&scrollbar=1'}">개인 이야기</button>
    </aside>

    <aside class="investigation-ledger lobby-ledger">
        <section class="ledger-section">
            <p class="eyebrow">내가 쥔 단서</p>
            <div class="ledger-list" data-private-evidence></div>
        </section>
        <section class="ledger-section">
            <p class="eyebrow">모두의 기록</p>
            <div class="ledger-list" data-public-evidence></div>
        </section>
    </aside>

    <section class="floating-panel parchment story-panel" id="acting-panel" data-panel hidden>
        <button class="panel-close" data-panel-close type="button">닫기</button>
        <p class="eyebrow">연기 힌트</p>
        <div class="locked-panel" data-acting-locked th:hidden="${storyRevealed}">
            <span>잠김</span>
            <p>아직 공개되지 않았습니다. 관리자가 공개하면 확인할 수 있습니다.</p>
        </div>
        <div class="story-body story-reader-body" data-acting-content hidden></div>
        <div class="ending-controls story-reader-controls" data-acting-controls hidden>
            <button class="button ghost small" data-acting-prev type="button">뒤로가기</button>
            <span data-acting-page-indicator>1 / 1</span>
            <button class="button primary small" data-acting-next type="button">다음 장</button>
        </div>
    </section>

    <form class="floating-panel parchment vote-form" data-vote th:hidden="${state.phase.name() != 'VOTE'}">
        <p class="eyebrow">투표</p>
        <label for="suspectCode">범인 지목</label>
        <select id="suspectCode" name="suspectCode">
            <option th:each="suspect : ${suspects}" th:value="${suspect.code}" th:text="${suspect.name}">빨간망토</option>
        </select>
        <button class="button primary" type="submit">투표한다</button>
    </form>

    <section class="ending-reveal" data-ending-reveal hidden aria-live="polite">
        <div class="ending-page">
            <p class="eyebrow">마지막 진실</p>
            <h2 data-ending-title>토끼가 남긴 마지막 시간</h2>
            <div class="ending-body" data-ending-body></div>
            <div class="ending-controls">
                <button class="button ghost small" data-ending-prev type="button">이전 장</button>
                <span data-ending-page-indicator>1 / 1</span>
                <button class="button primary small" data-ending-next type="button">다음 장</button>
            </div>
        </div>
    </section>
</main>
<section class="story-pdf-modal" data-story-pdf-modal hidden>
    <div class="story-pdf-backdrop" data-story-pdf-close></div>
    <article class="story-pdf-dialog" role="dialog" aria-modal="true" aria-labelledby="story-pdf-title">
        <header>
            <h2 id="story-pdf-title" data-story-pdf-title>개인 이야기</h2>
            <button class="button ghost small" type="button" data-story-pdf-close>닫기</button>
        </header>
        <iframe class="story-pdf-frame" data-story-pdf-frame title="개인 이야기"></iframe>
    </article>
</section>
<section class="evidence-context-menu" data-evidence-menu hidden>
    <button type="button" data-menu-publish>증거 공개하기</button>
    <button type="button" data-menu-detail>상세 보기</button>
    <button type="button" data-menu-close>닫기</button>
</section>
<section class="evidence-confirm-modal" data-publish-confirm hidden>
    <div class="memory-backdrop" data-confirm-cancel></div>
    <article class="memory-paper confirm-paper">
        <p class="eyebrow">공개 확인</p>
        <h2 data-confirm-title>증거를 공개하시겠습니까?</h2>
        <p>공용 설명은 모든 플레이어가 볼 수 있습니다. 개인 해석은 각자의 캐릭터에 맞는 내용만 표시됩니다.</p>
        <div class="button-row">
            <button class="button danger" type="button" data-confirm-publish>공개하기</button>
            <button class="button ghost" type="button" data-confirm-cancel>취소</button>
        </div>
    </article>
</section>
<section class="evidence-memory-modal" data-memory-modal hidden>
    <div class="memory-backdrop" data-memory-close></div>
    <article class="memory-paper" role="dialog" aria-modal="true" aria-labelledby="memory-title">
        <button class="button ghost small memory-close" type="button" data-memory-close>접기</button>
        <p class="eyebrow" data-memory-location>사건 장소</p>
        <h2 id="memory-title" data-memory-title>증거</h2>
        <section class="memory-section">
            <h3>공용 기록</h3>
            <div class="memory-text" data-memory-common></div>
        </section>
        <section class="memory-section">
            <h3>개인 해석</h3>
            <div class="memory-text" data-memory-personal></div>
        </section>
        <section class="memory-section recalled-memory" data-memory-recalled-wrap hidden>
            <h3>떠오른 말</h3>
            <div class="memory-text" data-memory-recalled></div>
        </section>
    </article>
</section>
<div class="phase-curtain" data-phase-curtain hidden>
    <div>
        <p>눈을 감습니다.</p>
        <span>저택의 불빛이 잠시 사라집니다.</span>
    </div>
</div>
<div class="toast" data-toast hidden></div>
</body>
</html>
