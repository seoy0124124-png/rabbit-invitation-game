<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>플레이어 무대</title>
    <link rel="stylesheet" href="/css/game.css">
    <link rel="stylesheet" href="/css/visual-novel.css">
    <script defer src="/js/game.js"></script>
</head>
<body class="scene scene-game stage-body" th:classappend="' player-' + ${#strings.toLowerCase(player.code)}">
<div class="snow" aria-hidden="true"></div>
<header class="topbar stage-topbar">
    <div class="topbar-progress-slot">
        <section class="player-progress-guide" data-progress-guidance aria-live="polite">
            <p data-progress-title>현재 진행 안내</p>
            <span data-progress-line-one>저택의 밤이 시작되기를 기다리고 있습니다.</span>
            <span data-progress-line-two>관리자의 진행에 따라 다음 기록이 열립니다.</span>
        </section>
    </div>
    <div class="topbar-actions">
        <form action="/leave" method="post">
            <button class="button danger small" type="submit">입장 화면으로 나가기</button>
        </form>
        <div class="timer" data-timer>00:00</div>
    </div>
</header>

<main class="murder-stage">
    <section class="stage-circle" aria-label="붉은 설산의 저택 무대">
        <div class="round-table" aria-hidden="true"></div>
        <div class="stage-props" aria-hidden="true">
            <span class="prop candle"></span>
            <span class="prop watch"></span>
            <span class="prop card card-one"></span>
            <span class="prop card card-two"></span>
        </div>

        <button class="character-shadow"
                th:each="character, stat : ${suspects}"
                th:classappend="| character-${#strings.toLowerCase(character.code)} ${character.code == player.code ? 'self' : ''}|"
                th:style="'--i:' + ${stat.index} + '; --total:' + ${suspects.size()} + '; --accent:' + ${character.color}"
                th:data-name="${character.name}"
                th:data-role="${character.publicDescription}"
                type="button">
            <img class="silhouette-img"
                 th:src="@{'/images/characters/' + ${#strings.toLowerCase(character.code)} + '.png'}"
                 th:alt="${character.name} + ' 실루엣'">
            <span class="shadow-tooltip">
                <strong th:text="${character.name}">빨간망토</strong>
                <em th:text="${character.publicDescription}">사람을 쉽게 믿지 않는 인물</em>
            </span>
        </button>
    </section>

    <aside class="personal-dock" aria-label="개인 기능">
        <a class="button ghost small evidence-board-link" href="/map">증거판</a>
        <button class="button ghost small" data-panel-target="acting-panel" type="button">연기 힌트</button>
        <button class="button ghost small"
                type="button"
                data-story-pdf-open
                data-story-pdf-button
                th:disabled="${!storyRevealed}"
                th:data-story-pdf-title="${player.name} + ' 개인 이야기'"
                th:data-story-pdf-src="@{'/docs/' + ${#strings.toLowerCase(player.code)} + '-private-story.pdf#toolbar=0&navpanes=0&scrollbar=1'}">개인 이야기</button>
    </aside>

    <section class="floating-panel parchment story-panel" id="acting-panel" data-panel hidden>
        <button class="panel-close" data-panel-close type="button">닫기</button>
        <p class="eyebrow">연기 힌트</p>
        <div class="locked-panel" data-acting-locked th:hidden="${storyRevealed}">
            <span>잠김</span>
            <p>개인 이야기가 공개되면 볼 수 있습니다.</p>
        </div>
        <div class="story-body story-reader-body" data-acting-content hidden></div>
    </section>

    <form class="floating-panel parchment vote-form game-frame vote-board-frame" data-vote th:hidden="${state.phase.name() != 'VOTE'}">
        <img class="game-frame-image" src="/images/ui/vote-board-frame.png" alt="">
        <div class="game-frame-overlay vote-board-overlay">
            <p class="eyebrow">투표</p>
            <p class="vote-selected-name" data-vote-selected-name>빨간망토</p>
            <fieldset class="vote-target-list" aria-label="범인 지목">
                <label class="vote-target"
                       th:each="suspect, stat : ${suspects}">
                    <input type="radio"
                           name="suspectCode"
                           th:value="${suspect.code}"
                           th:checked="${stat.index == 0}">
                    <span class="vote-portrait-card">
                        <img th:src="@{'/images/characters/' + ${#strings.toLowerCase(suspect.code)} + '.png'}"
                             th:alt="${suspect.name}">
                        <strong th:text="${suspect.name}">빨간망토</strong>
                    </span>
                </label>
            </fieldset>
            <button class="button primary" type="submit">투표한다</button>
        </div>
    </form>

    <section class="ending-reveal" data-ending-reveal hidden aria-live="polite">
        <div class="ending-page">
            <p class="eyebrow">마지막 진실</p>
            <h2 data-ending-title>토끼가 남긴 마지막 시간</h2>
            <div class="ending-body" data-ending-body></div>
            <div class="ending-controls">
                <button class="button ghost small" data-ending-prev type="button">이전</button>
                <span data-ending-page-indicator>1 / 1</span>
                <button class="button primary small" data-ending-next type="button">다음</button>
            </div>
            <form class="ending-finish" action="/leave" method="post" data-ending-finish hidden>
                <button class="button danger" type="submit">게임 종료</button>
            </form>
        </div>
    </section>
</main>

<section class="story-pdf-modal" data-story-pdf-modal hidden>
    <div class="story-pdf-backdrop" data-story-pdf-close></div>
    <article class="story-pdf-dialog" role="dialog" aria-modal="true" aria-labelledby="story-pdf-title">
        <header>
            <h2 id="story-pdf-title" data-story-pdf-title>개인 이야기</h2>
            <button class="button ghost small" type="button" data-story-pdf-close>닫기</button>
        </header>
        <iframe class="story-pdf-frame" data-story-pdf-frame title="개인 이야기"></iframe>
    </article>
</section>

<div class="phase-curtain" data-phase-curtain hidden>
    <div>
        <p>눈을 감습니다.</p>
        <span>저택의 불빛이 잠시 사라집니다.</span>
    </div>
</div>
<div class="toast" data-toast hidden></div>
</body>
</html>
